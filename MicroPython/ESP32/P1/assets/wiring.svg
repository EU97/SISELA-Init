<?xml version="1.0" encoding="UTF-8"?>
<!-- Placeholder SVG: genera una versión actualizada desde assets/wiring.mmd con mermaid-cli (ver PINES.md) -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <style>
      .box { fill:#f7f7f7; stroke:#333; stroke-width:1.5; }
      .label { font-family: Arial, sans-serif; font-size:14px; fill:#222; }
      .small { font-size:12px; fill:#444; }
      .wire { stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .gnd { stroke:#333; stroke-width:2; }
    </style>
  </defs>

  <!-- ESP32 Area -->
  <rect x="40" y="40" width="280" height="420" class="box"/>
  <text x="180" y="65" text-anchor="middle" class="label">ESP32</text>

  <!-- GPIO pins -->
  <text x="60" y="110" class="label">GPIO2</text>
  <circle cx="300" cy="110" r="5" fill="#333"/>
  <line x1="100" y1="110" x2="300" y2="110" class="wire"/>

  <text x="60" y="160" class="label">GPIO4</text>
  <circle cx="300" cy="160" r="5" fill="#333"/>
  <line x1="100" y1="160" x2="300" y2="160" class="wire"/>

  <text x="60" y="210" class="label">GPIO5</text>
  <circle cx="300" cy="210" r="5" fill="#333"/>
  <line x1="100" y1="210" x2="300" y2="210" class="wire"/>

  <text x="60" y="300" class="label">GPIO13</text>
  <circle cx="300" cy="300" r="5" fill="#333"/>
  <line x1="120" y1="300" x2="300" y2="300" class="wire"/>

  <text x="60" y="350" class="label">GPIO14</text>
  <circle cx="300" cy="350" r="5" fill="#333"/>
  <line x1="120" y1="350" x2="300" y2="350" class="wire"/>

  <!-- LED chains with resistors to GND -->
  <!-- LED1 from GPIO2 -->
  <rect x="340" y="95" width="60" height="30" class="box"/>
  <text x="370" y="115" text-anchor="middle" class="small">R 220Ω</text>
  <line x1="305" y1="110" x2="340" y2="110" class="wire"/>
  <circle cx="420" cy="110" r="10" fill="#ff6666" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="90" text-anchor="middle" class="small">LED1</text>
  <line x1="430" y1="110" x2="520" y2="110" class="wire"/>
  <line x1="520" y1="110" x2="520" y2="140" class="gnd"/>
  <line x1="510" y1="140" x2="530" y2="140" class="gnd"/>
  <line x1="515" y1="145" x2="525" y2="145" class="gnd"/>

  <!-- LED2 from GPIO4 -->
  <rect x="340" y="145" width="60" height="30" class="box"/>
  <text x="370" y="165" text-anchor="middle" class="small">R 220Ω</text>
  <line x1="305" y1="160" x2="340" y2="160" class="wire"/>
  <circle cx="420" cy="160" r="10" fill="#66ccff" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="140" text-anchor="middle" class="small">LED2</text>
  <line x1="430" y1="160" x2="520" y2="160" class="wire"/>
  <line x1="520" y1="160" x2="520" y2="190" class="gnd"/>
  <line x1="510" y1="190" x2="530" y2="190" class="gnd"/>
  <line x1="515" y1="195" x2="525" y2="195" class="gnd"/>

  <!-- LED3 from GPIO5 -->
  <rect x="340" y="195" width="60" height="30" class="box"/>
  <text x="370" y="215" text-anchor="middle" class="small">R 220Ω</text>
  <line x1="305" y1="210" x2="340" y2="210" class="wire"/>
  <circle cx="420" cy="210" r="10" fill="#ffcc66" stroke="#333" stroke-width="1.5"/>
  <text x="420" y="190" text-anchor="middle" class="small">LED3</text>
  <line x1="430" y1="210" x2="520" y2="210" class="wire"/>
  <line x1="520" y1="210" x2="520" y2="240" class="gnd"/>
  <line x1="510" y1="240" x2="530" y2="240" class="gnd"/>
  <line x1="515" y1="245" x2="525" y2="245" class="gnd"/>

  <!-- Buttons to GND (active LOW with pull-up) -->
  <rect x="360" y="280" width="70" height="30" class="box"/>
  <text x="395" y="300" text-anchor="middle" class="small">BTN1</text>
  <line x1="305" y1="300" x2="360" y2="300" class="wire"/>
  <line x1="430" y1="300" x2="520" y2="300" class="gnd"/>
  <line x1="520" y1="300" x2="520" y2="330" class="gnd"/>
  <line x1="510" y1="330" x2="530" y2="330" class="gnd"/>
  <line x1="515" y1="335" x2="525" y2="335" class="gnd"/>

  <rect x="360" y="330" width="70" height="30" class="box"/>
  <text x="395" y="350" text-anchor="middle" class="small">BTN2</text>
  <line x1="305" y1="350" x2="360" y2="350" class="wire"/>
  <line x1="430" y1="350" x2="520" y2="350" class="gnd"/>
  <line x1="520" y1="350" x2="520" y2="380" class="gnd"/>
  <line x1="510" y1="380" x2="530" y2="380" class="gnd"/>
  <line x1="515" y1="385" x2="525" y2="385" class="gnd"/>

  <!-- Legend -->
  <text x="40" y="480" class="small">LEDs activos en ALTO (LED_ON_LEVEL=1); botones usan pull-up interno y se pulsan a GND (nivel LOW).</text>
</svg>
