<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1000" height="600" viewBox="0 0 1000 600">
  <!-- ESP32 Block -->
  <rect x="50" y="100" width="200" height="200" fill="#ADD8E6" stroke="#000" stroke-width="2"/>
  <text x="150" y="130" text-anchor="middle" font-weight="bold" font-size="16">ESP32 DevKit</text>
  
  <!-- GPIO34 Pin -->
  <rect x="70" y="150" width="160" height="40" fill="#90EE90" stroke="#000" stroke-width="1"/>
  <text x="150" y="170" text-anchor="middle" font-size="12">GPIO34 (ADC1_CH6)</text>
  <text x="150" y="185" text-anchor="middle" font-size="10">12bit, ATTN_11DB</text>
  
  <!-- 3V3 Pin -->
  <rect x="70" y="200" width="160" height="30" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="150" y="220" text-anchor="middle" font-size="12">3V3</text>
  
  <!-- GND Pin -->
  <rect x="70" y="240" width="160" height="30" fill="#DDD" stroke="#000" stroke-width="1"/>
  <text x="150" y="260" text-anchor="middle" font-size="12">GND</text>
  
  <!-- MPX5500DP Sensor Block -->
  <rect x="500" y="100" width="200" height="200" fill="#FFE4B5" stroke="#000" stroke-width="2"/>
  <text x="600" y="125" text-anchor="middle" font-weight="bold" font-size="16">MPX5500DP Sensor</text>
  <text x="600" y="145" text-anchor="middle" font-size="10">(SOT-223 Package)</text>
  
  <!-- Pin 1: GND -->
  <rect x="520" y="160" width="160" height="30" fill="#DDD" stroke="#000" stroke-width="1"/>
  <text x="600" y="180" text-anchor="middle" font-size="12">Pin 1: GND</text>
  
  <!-- Pin 2: VS -->
  <rect x="520" y="200" width="160" height="30" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="600" y="220" text-anchor="middle" font-size="12">Pin 2: VS (4.75-5.25V)</text>
  
  <!-- Pin 3: Vout -->
  <rect x="520" y="240" width="160" height="30" fill="#FFD700" stroke="#000" stroke-width="1"/>
  <text x="600" y="260" text-anchor="middle" font-size="12">Pin 3: Vout (0.66-3.3V)</text>
  
  <!-- Connections -->
  <!-- 3V3 to VS -->
  <line x1="230" y1="215" x2="520" y2="215" stroke="#FF0000" stroke-width="2"/>
  <text x="375" y="210" text-anchor="middle" font-size="10" fill="#FF0000">3.3V</text>
  
  <!-- GND to GND -->
  <line x1="230" y1="255" x2="520" y2="175" stroke="#000" stroke-width="2"/>
  <text x="375" y="240" text-anchor="middle" font-size="10">GND</text>
  
  <!-- Vout to GPIO34 -->
  <line x1="520" y1="255" x2="230" y2="170" stroke="#0000FF" stroke-width="2"/>
  <text x="375" y="190" text-anchor="middle" font-size="10" fill="#0000FF">Vout (0.66-3.3V)</text>
  
  <!-- Notes -->
  <rect x="50" y="350" width="300" height="80" fill="#FFF9DB" stroke="#FFD43B" stroke-width="2"/>
  <text x="200" y="375" text-anchor="middle" font-size="12" font-weight="bold">⚠️ NOTA 1:</text>
  <text x="200" y="395" text-anchor="middle" font-size="11">GPIO34 es INPUT-ONLY</text>
  <text x="200" y="415" text-anchor="middle" font-size="11">No puede ser salida digital</text>
  
  <rect x="400" y="350" width="300" height="80" fill="#FFE8CC" stroke="#FD7E14" stroke-width="2"/>
  <text x="550" y="375" text-anchor="middle" font-size="12" font-weight="bold">⚠️ NOTA 2:</text>
  <text x="550" y="395" text-anchor="middle" font-size="11">MPX5500DP óptimo a VS=5V</text>
  <text x="550" y="415" text-anchor="middle" font-size="11">Con VS=3.3V: 66% sensibilidad</text>
  
  <rect x="50" y="450" width="300" height="80" fill="#D3F9D8" stroke="#51CF66" stroke-width="2"/>
  <text x="200" y="475" text-anchor="middle" font-size="12" font-weight="bold">✓ NOTA 3:</text>
  <text x="200" y="495" text-anchor="middle" font-size="11">ADC promedia 50 muestras</text>
  <text x="200" y="515" text-anchor="middle" font-size="11">Reduce ruido ~7x</text>
  
  <!-- Optional 5V Circuit (dashed) -->
  <rect x="750" y="100" width="220" height="200" fill="#E6E6FA" stroke="#9370DB" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="860" y="125" text-anchor="middle" font-weight="bold" font-size="14">Circuito Opcional</text>
  <text x="860" y="145" text-anchor="middle" font-size="10">(para VS=5V)</text>
  
  <text x="860" y="175" text-anchor="middle" font-size="11">Divisor resistivo:</text>
  <text x="860" y="195" text-anchor="middle" font-size="11">R1: 10kΩ</text>
  <text x="860" y="215" text-anchor="middle" font-size="11">R2: 10kΩ</text>
  <text x="860" y="235" text-anchor="middle" font-size="11">5V → 2.5V máx</text>
  <text x="860" y="255" text-anchor="middle" font-size="10" font-style="italic">(Protege ADC a 3.3V)</text>
</svg>
