<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320">
  <style>
    .box{fill:#f7f7f7;stroke:#333;stroke-width:1.2}
    .title{font: 700 14px sans-serif; fill:#222}
    .lbl{font: 12px sans-serif; fill:#222}
    .pin{font: 11px monospace; fill:#222}
    .wire{stroke-width:2.5}
    .note{font: 12px sans-serif; fill:#444}
  </style>
  <!-- ESP32 -->
  <rect class="box" x="30" y="30" width="220" height="240" rx="6"/>
  <text class="title" x="140" y="52" text-anchor="middle">ESP32 DevKit</text>
  <text class="pin" x="45" y="90">GPIO21 (SDA)</text>
  <text class="pin" x="45" y="120">GPIO22 (SCL)</text>
  <text class="pin" x="45" y="150">3.3V</text>
  <text class="pin" x="45" y="180">GND</text>

  <!-- OLED -->
  <rect class="box" x="300" y="40" width="200" height="120" rx="6"/>
  <text class="title" x="400" y="62" text-anchor="middle">OLED SSD1306 (0x3C)</text>
  <text class="pin" x="315" y="90">SDA</text>
  <text class="pin" x="315" y="110">SCL</text>
  <text class="pin" x="315" y="130">VCC 3.3V</text>
  <text class="pin" x="315" y="150">GND</text>

  <!-- BMP280 -->
  <rect class="box" x="300" y="190" width="200" height="100" rx="6"/>
  <text class="title" x="400" y="212" text-anchor="middle">BMP280 (0x76/0x77)</text>
  <text class="pin" x="315" y="240">SDA</text>
  <text class="pin" x="315" y="260">SCL</text>
  <text class="pin" x="315" y="280">VCC 3.3V</text>
  <text class="pin" x="315" y="300">GND</text>

  <!-- Wires from ESP32 to OLED -->
  <line x1="160" y1="86" x2="300" y2="96" stroke="#1f77b4" class="wire"/>
  <line x1="160" y1="116" x2="300" y2="116" stroke="#ff7f0e" class="wire"/>
  <line x1="150" y1="146" x2="300" y2="136" stroke="#2ca02c" class="wire"/>
  <line x1="150" y1="176" x2="300" y2="156" stroke="#000" class="wire"/>

  <!-- Wires from ESP32 to BMP280 -->
  <line x1="160" y1="86" x2="300" y2="236" stroke="#1f77b4" class="wire"/>
  <line x1="160" y1="116" x2="300" y2="256" stroke="#ff7f0e" class="wire"/>
  <line x1="150" y1="146" x2="300" y2="276" stroke="#2ca02c" class="wire"/>
  <line x1="150" y1="176" x2="300" y2="296" stroke="#000" class="wire"/>

  <!-- Legend -->
  <rect x="540" y="40" width="210" height="110" rx="6" class="box"/>
  <text class="title" x="645" y="62" text-anchor="middle">Leyenda</text>
  <circle cx="560" cy="85" r="5" fill="#1f77b4"/>
  <text class="lbl" x="575" y="90">SDA</text>
  <circle cx="560" cy="105" r="5" fill="#ff7f0e"/>
  <text class="lbl" x="575" y="110">SCL</text>
  <circle cx="560" cy="125" r="5" fill="#2ca02c"/>
  <text class="lbl" x="575" y="130">3.3V</text>
  <circle cx="560" cy="145" r="5" fill="#000"/>
  <text class="lbl" x="575" y="150">GND</text>

  <text class="note" x="390" y="15" text-anchor="middle">Ambos dispositivos comparten el bus I2C (SDA/SCL) — usar 3.3V</text>
</svg>
