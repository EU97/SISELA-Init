[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
; Cambia el número de práctica (1-8)
build_flags = -DPRACTICE=1

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 921600
build_flags = ${env.build_flags} -DARDUINO_ARCH_ESP32

[env:pico]
platform = raspberrypi
board = pico
build_flags = ${env.build_flags} -DARDUINO_ARCH_RP2040
