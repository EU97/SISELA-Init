[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
; Cambia el número de práctica (1-8)
; Selección de driver por defecto: A4988 (quitar y usar -DSTEPPER_ULN2003 si corresponde)
; -std=gnu++17: los cores Arduino (esp32/rp2040) compilan por defecto en gnu++11,
; donde una struct con inicializadores de miembro por defecto (ver pins_types.h)
; deja de ser un agregado y las tablas de pines (pins_esp32.h/pins_rp2040.h) no
; compilan ("could not convert ... to 'Pins'"). gnu++17 restaura la agregación.
build_flags = -DPRACTICE=1 -DSTEPPER_A4988 -std=gnu++17
build_unflags = -std=gnu++11

; ── Análisis de señales (P4–P8) ──────────────────────────────────────────────
; Las prácticas P4–P8 incluyen modos de análisis de señales que usan
; src/common/siglab.h (adquisición a Fs fija + estadística) y la toolkit PC
; tools/sisela_signal/. En RP2040 el ADC de Arduino es 10 bit por defecto; las
; prácticas afectadas llaman analogReadResolution(12) para igualar a MicroPython.

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 921600
build_flags = ${env.build_flags} -DARDUINO_ARCH_ESP32
lib_deps = 
	madhephaestus/ESP32Servo@^3.0.5

[env:pico]
platform = raspberrypi
board = pico
; El core "mbed" (oficial Arduino, por defecto en la plataforma raspberrypi)
; NO implementa analogWriteFreq()/analogWriteRange(), usados por
; common/flight_controls.h y common/esc.h para fijar 50 Hz en servos/ESC.
; El core "earlephilhower" (arduino-pico) sí los implementa y es el que
; asume el resto del código (macros GPx, etc.).
board_build.core = earlephilhower
build_flags = ${env.build_flags} -DARDUINO_ARCH_RP2040

