<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Plantilla: ESP32 + Dispositivo (C++)</title>
  <desc id="desc">Diagrama genérico: Señal a GPIOXX, VCC a 3V3, GND a GND.</desc>
  <defs>
    <style>
      .box{fill:#ffffff;stroke:#333;stroke-width:2;rx:10;ry:10}
      .label{font-family:Segoe UI, Arial, sans-serif;font-size:14px;fill:#222}
      .title{font-weight:700;font-size:16px}
      .pin{font-size:13px}
      .wire{stroke:#2a7;stroke-width:3}
      .wire-gnd{stroke:#555;stroke-width:3}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7" />
    </marker>
  </defs>

  <rect class="box" x="40" y="70" width="280" height="180" />
  <text class="label title" x="180" y="95" text-anchor="middle">Sensor / Actuador</text>
  <circle cx="80" cy="160" r="5" fill="#c33" />
  <text class="label pin" x="90" y="165">VCC</text>
  <circle cx="180" cy="200" r="5" fill="#27f" />
  <text class="label pin" x="190" y="205">Señal</text>
  <circle cx="80" cy="240" r="5" fill="#555" />
  <text class="label pin" x="90" y="245">GND</text>

  <rect class="box" x="440" y="50" width="280" height="220" />
  <text class="label title" x="580" y="75" text-anchor="middle">ESP32 DevKit</text>

  <circle cx="720" cy="120" r="5" fill="#2a7" />
  <text class="label pin" x="710" y="125" text-anchor="end">3V3</text>
  <circle cx="720" cy="220" r="5" fill="#555" />
  <text class="label pin" x="710" y="225" text-anchor="end">GND</text>
  <circle cx="440" cy="170" r="5" fill="#27f" />
  <text class="label pin" x="450" y="175">GPIOXX</text>

  <path class="wire" d="M 80 160 C 180 160, 300 120, 720 120" fill="none" marker-end="url(#arrow)" />
  <path class="wire-gnd" d="M 80 240 C 180 240, 300 220, 720 220" fill="none" marker-end="url(#arrow)" />
  <path class="wire" d="M 180 200 C 280 200, 360 190, 440 170" fill="none" marker-end="url(#arrow)" />
</svg>
